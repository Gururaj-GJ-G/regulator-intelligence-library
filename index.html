<!doctype html>
<html lang="en">
  <head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LE0QJNT1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LE0QJNT1');

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Regulator Intelligence Library</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <div id="app"></div>

    <div id="export-modal" class="modal-backdrop hidden" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="export-title">
        <div class="modal-head">
          <h2 id="export-title">Export Data Options</h2>
          <button class="icon-button" data-close-export title="Close">x</button>
        </div>
        <div class="modal-body">
          <fieldset>
            <legend>Scope Selection</legend>
            <label><input type="radio" name="export-scope" value="filtered" checked> Current Filtered Viewport Records Only <span id="filtered-count"></span></label>
            <label><input type="radio" name="export-scope" value="global"> Global Unfiltered Dataset <span id="global-count"></span></label>
          </fieldset>
          <label class="field">
            <span>Format Archetype</span>
            <select id="export-format">
              <option value="csv">CSV (.csv)</option>
              <option value="xlsx">Excel Spreadsheet (.xlsx)</option>
              <option value="pdf">Audit PDF (.pdf)</option>
            </select>
          </label>
          <label class="field">
            <span>Schema Profile</span>
            <select id="export-schema">
              <option value="standard">Standard Table Structure</option>
              <option value="tree">Full Relational Tree Dump</option>
            </select>
          </label>
        </div>
        <div class="modal-actions">
          <button class="ghost" data-close-export>Cancel</button>
          <button class="primary" id="execute-export">Execute Export</button>
        </div>
      </div>
    </div>

    <script src="src/seed-data.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
